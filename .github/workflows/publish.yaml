---
name: Upload Python Package
on:
  release:
    types:
      - published

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  deploy:
    needs:
      - test

    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Embed SBOM into the wheel
        id: pitloom
        uses: bact/pitloom@fd0639031918fde2dbb288f0086bbf5414b948d1 # v0.24.0
        with:
          embed-wheel: "dist/*.whl"
          extras: "content-type"
          content-type: "true"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v.1.14.3
